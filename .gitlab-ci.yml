# GitLab CI/CD Pipeline for Deploy on EC2 with Docker Compose

stages:
  - check
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  AWS_DEFAULT_REGION: sa-east-1
  AWS_ECR_REGISTRY: 767397966564.dkr.ecr.sa-east-1.amazonaws.com
  AWS_ECR_REPOSITORY: huglabs/huglabs_api
  EC2_HOST: ec2-18-231-248-237.sa-east-1.compute.amazonaws.com
  EC2_USER: ubuntu
  EC2_PRIVATE_KEY: $EC2_PRIVATE_KEY
  EC2_HOST_KEY: ssh-keyscan ec2-18-231-248-237.sa-east-1.compute.amazonaws.com

default:
  tags:
    - huglabs
    - docker

#TODO: Adjust key pair hug-oficial.pem for git-lab-access (this is a very important security step)

# Check if should deploy today
should-deploy:
  stage: check
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      echo "🔍 Checking shouldideploy.today..."
      RESPONSE=$(curl -s "https://shouldideploy.today/api?tz=UTC")
      
      if [ -z "$RESPONSE" ]; then
        echo "⚠️ do !Not found, imagine if this deploy do works!"
        echo "going to deploy, only if you know what you are doing..."
      else
        echo "✅ $RESPONSE"
      fi
  only:
    - main

# Build Docker image for application build
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - huglabs
    - docker
  before_script:
    # Wait for Docker daemon to be ready with timeout
    - |
      echo "Waiting for Docker daemon..."
      timeout=60
      counter=0
      until docker info >/dev/null 2>&1; do
        if [ $counter -ge $timeout ]; then
          echo "ERROR: Docker daemon failed to start after ${timeout} seconds"
          exit 1
        fi
        echo "Waiting... ($counter/$timeout)"
        sleep 1
        counter=$((counter + 1))
      done
      echo "Docker daemon is ready!"
    
    - apk add --no-cache aws-cli || {
        echo "APK aws-cli não disponível, instalando via pip em venv";
        apk add --no-cache python3 py3-pip py3-venv;
        python3 -m venv /tmp/aws-env;
        source /tmp/aws-env/bin/activate;
        pip install awscli;
      }
    # Login on AWS ECR
    - |
      if [ -d "/tmp/aws-env" ]; then
        source /tmp/aws-env/bin/activate
      fi
      echo "Fazendo login no AWS ECR..."
      aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ECR_REGISTRY
      echo "Sucess ECR login."
  script:
    # Build da imagem with mult tags
    - docker build -t $AWS_ECR_REGISTRY/$AWS_ECR_REPOSITORY:$CI_COMMIT_SHA -t $AWS_ECR_REGISTRY/$AWS_ECR_REPOSITORY:latest .
    # Push of both tags
    - docker push $AWS_ECR_REGISTRY/$AWS_ECR_REPOSITORY:$CI_COMMIT_SHA
    - docker push $AWS_ECR_REGISTRY/$AWS_ECR_REPOSITORY:latest
  only:
    - main

# Deploy for EC2
deploy:production:
  stage: deploy
  image: alpine:latest
  tags:
    - huglabs
    - docker
  before_script:
    # Install necessary dependencies
    - apk add --no-cache openssh-client aws-cli curl
    - eval $(ssh-agent -s)
    - echo "$EC2_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Configure SSH with debug
    - |
      echo "🔍 Configuring SSH..."
      if [ -n "$EC2_HOST_KEY" ]; then
        echo "📋 Host key provided, configuring..."
        echo "$EC2_HOST_KEY" > ~/.ssh/known_hosts
        echo "📄 Content of known_hosts:"
        cat ~/.ssh/known_hosts
      else
        echo "🔄 Automatically obtaining host key..."
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || echo "⚠️ Failed to ssh-keyscan"
      fi
      
      # Always try to obtain additional host key as fallback
      echo "🔄 Adding additional host key as fallback..."
      ssh-keyscan $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
      ssh-keyscan -t rsa $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
      ssh-keyscan -t ecdsa $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
      
      chmod 644 ~/.ssh/known_hosts
      echo "✅ SSH configured successfully"
      echo "📄 Final known_hosts:"
      cat ~/.ssh/known_hosts
  script:
    # Test SSH connection first
    - |
      echo "🔐 Testing SSH connection..."
      ssh -o BatchMode=yes -o ConnectTimeout=10 $EC2_USER@$EC2_HOST "echo '✅ SSH connection established'"
      
    # Create directory and copy docker-compose to production server
    - |
      echo "📁 Creating directory and copying docker-compose.prd.yml..."
      ssh -o BatchMode=yes -o ConnectTimeout=10 $EC2_USER@$EC2_HOST "mkdir -p /home/$EC2_USER/huglabs-api"
      scp -o BatchMode=yes -o ConnectTimeout=10 docker-compose.prd.yml $EC2_USER@$EC2_HOST:/home/$EC2_USER/huglabs-api/docker-compose.yml
      echo "✅ File copied successfully"
    # Provision .env from CI variable (masked)
    - |
      if [ -n "$ENV_PROD_CONTENT" ]; then
        echo "🔐 Provisioning .env on server from CI variable..."
        ssh $EC2_USER@$EC2_HOST "printf '%s' \"$ENV_PROD_CONTENT\" > /home/$EC2_USER/huglabs-api/.env && chmod 600 /home/$EC2_USER/huglabs-api/.env"
      else
        echo "⚠️ ENV_PROD_CONTENT not set; container may fail to boot without environment."
      fi
    

    # Deploy on EC2 server
    - |
      ssh $EC2_USER@$EC2_HOST << EOF
        echo "🚀 Starting deploy..."
        
        # Create directory if it doesn't exist
        mkdir -p /home/ubuntu/huglabs-api
        cd /home/ubuntu/huglabs-api
        
        echo "🔧 Checking dependencies..."
        # Install basic dependencies
        sudo apt-get update -qq
        sudo apt-get install -y unzip docker.io docker-compose-v2
        # Ensure Docker service is enabled and running
        if command -v systemctl >/dev/null 2>&1; then
          sudo systemctl enable --now docker || true
        fi
        
        # Add user to docker group if necessary
        if ! groups ubuntu | grep -q docker; then
          echo "➕ Adding user to docker group..."
          sudo usermod -aG docker ubuntu
          echo "⚠️ Restart the SSH session to apply docker group changes"
        fi
        
        # Instalar AWS CLI se necessário
        if ! command -v aws >/dev/null 2>&1; then
          echo "📥 Instalando AWS CLI..."
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install
          rm -rf awscliv2.zip aws
        fi
        
        # Config Configure AWS credentials
        echo "🔑 Configuring AWS credentials..."
        mkdir -p ~/.aws
        
        # Debug: show variable values (without showing secrets)
        echo "Debug: AWS_ACCESS_KEY_ID present: $([ -n \"$AWS_ACCESS_KEY_ID\" ] && echo \"YES\" || echo \"NO\")"
        echo "Debug: AWS_SECRET_ACCESS_KEY present: $([ -n \"$AWS_SECRET_ACCESS_KEY\" ] && echo \"YES\" || echo \"NO\")"
        echo "Debug: AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
        
        echo "[default]" > ~/.aws/credentials
        echo "aws_access_key_id = $AWS_ACCESS_KEY_ID" >> ~/.aws/credentials
        echo "aws_secret_access_key = $AWS_SECRET_ACCESS_KEY" >> ~/.aws/credentials
        
        echo "[default]" > ~/.aws/config
        echo "region = $AWS_DEFAULT_REGION" >> ~/.aws/config
        echo "output = json" >> ~/.aws/config
        
        # Debug: Check if files were created
        echo "Debug: AWS files created:"
        ls -la ~/.aws/
        echo "Debug: CCredentials content (masked):"
        sed 's/aws_secret_access_key = .*/aws_secret_access_key = ***/' ~/.aws/credentials
        
        echo "🔑 Logging in to ECR..."
        aws ecr get-login-password --region $AWS_DEFAULT_REGION | sudo docker login --username AWS --password-stdin $AWS_ECR_REGISTRY
        
        echo "⏹️ Stopping existing services..."
        sudo docker compose down || true
        
        echo "🧹 Cleaning up old images..."
        sudo docker image prune -af || true
        
        echo "📥 Downloading new image..."
        sudo docker pull $AWS_ECR_REGISTRY/$AWS_ECR_REPOSITORY:latest

        echo "🚀 Starting services (with pull + wait)..."
        set -euo pipefail
        # Try bring up services, waiting for healthchecks
        if ! sudo docker compose up -d --pull always --wait; then
          echo "⚠️ First attempt failed, retrying once after prune..."
          sudo docker image prune -af || true
          sudo docker compose up -d --pull always --wait
        fi

        echo "🩺 Verifying HTTP health on host (with retry)..."
        # Retry loop to avoid race conditions right after compose reports healthy
        max_attempts=30
        attempt=1
        until curl -sf http://localhost:8000/health >/dev/null; do
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "❌ Health check failed on host after ${max_attempts} attempts. Showing recent logs..."
            sudo docker compose ps
            sudo docker compose logs --tail=200
            # Extra diagnostic: try application health inside container
            sudo docker compose exec -T huglabs_api curl -sS 127.0.0.1:3333/api/health || true
            exit 1
          fi
          echo "Waiting for host port 8000... (${attempt}/${max_attempts})"
          attempt=$((attempt + 1))
          sleep 2
        done
        echo "✅ Host health OK"
        
        echo "✅ Checking service status..."
        sudo docker compose ps
        echo "📋 Container logs:"
        sudo docker compose logs --tail=30
        
        echo "🎉 Deploy completed!"
      EOF
  after_script:
    - |
      DISCORD_WEBHOOK="https://discord.com/api/webhooks/1461729598713626676/XScbKbOVTWdotQcJVuJFtmj6DGEkZrp4RSDEdzI-2IHlpTjvaNunrpSkS5OAVfnsGVZR"
      
      # Escape commit message for JSON
      COMMIT_MSG=$(echo "$CI_COMMIT_MESSAGE" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g' | head -c 200)
      
      if [ "$CI_JOB_STATUS" = "success" ]; then
        EMBED_COLOR=3066993
        EMBED_TITLE="✅ Deploy Successful"
        EMBED_DESCRIPTION="Deployment to production has completed successfully!"
      else
        EMBED_COLOR=15158332
        EMBED_TITLE="❌ Deploy Failed"
        EMBED_DESCRIPTION="Deployment to production has failed. Check logs for details."
      fi
      
      curl -X POST "$DISCORD_WEBHOOK" \
        -H "Content-Type: application/json" \
        -d "{
          \"username\": \"GitLab CI\",
          \"avatar_url\": \"https://about.gitlab.com/images/press/logo/png/gitlab-icon-rgb.png\",
          \"embeds\": [{
            \"title\": \"$EMBED_TITLE\",
            \"description\": \"$EMBED_DESCRIPTION\",
            \"color\": $EMBED_COLOR,
            \"fields\": [
              {\"name\": \"Project\", \"value\": \"$CI_PROJECT_NAME\", \"inline\": true},
              {\"name\": \"Branch\", \"value\": \"$CI_COMMIT_BRANCH\", \"inline\": true},
              {\"name\": \"Commit\", \"value\": \"$CI_COMMIT_SHORT_SHA\", \"inline\": true},
              {\"name\": \"Author\", \"value\": \"$CI_COMMIT_AUTHOR\", \"inline\": true},
              {\"name\": \"Message\", \"value\": \"$COMMIT_MSG\", \"inline\": false}
            ],
            \"footer\": {\"text\": \"GitLab Pipeline\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }"
  environment:
    name: production
    url: http://$EC2_HOST
  only:
    - main
  needs:
    - build