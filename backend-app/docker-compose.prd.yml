services:
  huglabs_api:
    image: 767397966564.dkr.ecr.sa-east-1.amazonaws.com/huglabs/huglabs_api:latest
    container_name: huglabs_api
    env_file:
      - .env
    ports:
      - "8000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3333/api/health || curl -fsS http://127.0.0.1/health || curl -fsS http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
