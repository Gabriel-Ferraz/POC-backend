services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "3333:3333"
    volumes:
      - .:/app
    labels:
      - "traefik.enable=true"

      # rota /api → backend
      - "traefik.http.routers.app.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.app.entrypoints=web"

      # remove /api antes de enviar pro container
      - "traefik.http.middlewares.app-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.app.middlewares=app-strip"

      - "traefik.http.services.app.loadbalancer.server.port=3333"
    environment:
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      DB_CONNECTION: pgsql
      DB_USERNAME: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      SEED_DB: true
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  test:
    image: registry.dev.hugyourcustomer.ai/huglabs/php8.2-ci:latest
    working_dir: /app
    command: tail -f /dev/null
    stdin_open: true
    tty: true
    environment:
      APP_ENV: testing
    volumes:
      - .:/app
    networks:
      - network


  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:-poc_sjp}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poc_sjp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - network

  tomcat:
    image: tomcat:9-alpine
    ports:
      - "8180:8080"
    networks:
      - network

  adminer:
    image: adminer:latest
    ports:
      - "8181:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - network

  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
    ports:
      - "8008:80"
      - "8080:8080" # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
