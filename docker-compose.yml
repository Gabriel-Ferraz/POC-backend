services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=3333"
    environment:
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      DB_CONNECTION: oracle
      DB_HOST: oracle
      DB_PORT: 1521
      DB_DATABASE: FREEPDB1
      DB_USERNAME: ${DB_USERNAME:-poc_user}
      DB_PASSWORD: ${DB_PASSWORD:-poc_pass}
      DB_CHARSET: AL32UTF8
      SEED_DB: true
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    env_file:
      - .env
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../POC-frontend
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      NODE_ENV: production

  oracle:
    image: gvenzl/oracle-free:23-slim
    volumes:
      - oracle_data:/opt/oracle/oradata
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oraclepass}
      APP_USER: ${DB_USERNAME:-poc_user}
      APP_USER_PASSWORD: ${DB_PASSWORD:-poc_pass}
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 15s
      retries: 30
      start_period: 300s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  tomcat:
    image: tomcat:9-alpine

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: oracle
    depends_on:
      - oracle

  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
    ports:
      - "8008:80"
      - "8080:8080" # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml

volumes:
  oracle_data:
    driver: local
  redis_data:
    driver: local
