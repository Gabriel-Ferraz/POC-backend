[PHP]
post_max_size = 128M
upload_max_filesize = 128M
upload_tmp_dir = /tmp
file_uploads = On
max_file_uploads = 50
max_input_time = 60
expose_php = 0
realpath_cache_size = 32M
realpath_cache_ttl = 720
memory_limit = 256M
register_argc_argv = 0
date.timezone = America/Sao_Paulo

[opcache]
opcache.enable = 0
