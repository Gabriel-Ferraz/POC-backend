[supervisord]
user=root
nodaemon=true
silent=true
minfds=128
minprocs=50
pidfile=/var/run/supervisord.pid
loglevel=info
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=0

[program:octane]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan octane:start --server=swoole --host=0.0.0.0 --port=3333 --workers=2 --max-requests=10000
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
